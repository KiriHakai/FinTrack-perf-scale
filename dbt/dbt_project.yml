name: 'fintrack_perf_scale'
version: '3.0.0'
config-version: 2

profile: 'fintrack_perf_scale'

# "unit_tests" est déclaré comme model-path : dbt ne découvre les tests
# unitaires que dans les model-paths (cf. docs dbt — "Unit tests are discovered
# from model-paths"). Sans cette ligne, les fichiers de unit_tests/ sont
# purement ignorés, sans aucun avertissement.
model-paths:     ["models", "unit_tests"]
analysis-paths:  ["analyses"]
test-paths:      ["tests"]
seed-paths:      ["seeds"]
macro-paths:     ["macros"]
snapshot-paths:  ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

require-dbt-version: [">=1.8.0", "<2.0.0"]

# ============================================
# Query tag on every run
# ============================================
on-run-start:
  - "{{ fintrack_set_query_tag() }}"

on-run-end:
  - "{{ fintrack_unset_query_tag() }}"

# ============================================
# Modèles
# ============================================
models:
  fintrack_perf_scale:
    +persist_docs:
      relation: true
      columns: true

    staging:
      +materialized: view
      +schema: staging
      +tags: ['staging']
      # Transactions et virements overridés en incremental dans leurs configs

    intermediate:
      +materialized: ephemeral
      +tags: ['intermediate']

    marts:
      +materialized: table
      +tags: ['marts']
      core:
        +schema: marts_core
      finance:
        +schema: marts_finance
      analytics:
        +schema: marts_analytics

# ============================================
# Snapshots
# ============================================
snapshots:
  fintrack_perf_scale:
    +target_schema: snapshots

# ============================================
# Seeds
# ============================================
# Aucun seed dans le projet : la configuration a été retirée, dbt signalait
# "unused configuration paths" à chaque commande.
# À rétablir le jour où un référentiel statique (mapping MCC, table de pays…)
# sera versionné dans seeds/.

# ============================================
# Tests
# ============================================
tests:
  +store_failures: true
  +schema: audit_test_failures

# ============================================
# Variables
# ============================================
vars:
  # Fenêtre de lookback pour les modèles incrémentaux
  incremental_lookback_days: 7

  # Filtres de développement (accélère les runs en dev)
  dev_start_date: '2024-01-01'
  dev_end_date:   '2024-12-31'

  # dbt-utils
  'dbt_date:time_zone': 'Europe/Paris'
