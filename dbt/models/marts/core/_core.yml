version: 2

models:
  # ============================================
  # DIMENSIONS
  # ============================================
  - name: dim_tenants
    description: "Dimension des banques partenaires B2B2C"
    config:
      access: public
      group: core
    columns:
      - name: tenant_id
        tests: [unique, not_null]
      - name: tenant_code
        tests: [unique, not_null]
      - name: contract_tier
        tests:
          - accepted_values:
              arguments:
                values: ['gold', 'silver', 'bronze']

  - name: dim_comptes
    description: "Dimension comptes — état courant"
    config:
      access: public
      group: core
    columns:
      - name: compte_id
        tests: [unique, not_null]
      - name: tenant_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tenants')
                field: tenant_id
      - name: statut
        tests:
          - accepted_values:
              arguments:
                values: ['actif', 'inactif', 'cloture', 'suspendu']
      - name: kyc_level
        tests:
          - accepted_values:
              arguments:
                values: ['basic', 'intermediate', 'advanced', 'not_verified']

  - name: dim_comptes_scd2
    description: |
      Dimension comptes historisée (SCD Type 2) — piste d'audit réglementaire.
      Grain : une ligne = une version d'un compte, valide sur l'intervalle
      [date_debut_validite, date_fin_validite[ (borne haute EXCLUE).
      La version courante porte date_fin_validite = 9999-12-31, jamais NULL.
    config:
      access: public
      group: core
    columns:
      - name: compte_version_key
        description: "Surrogate key de la VERSION (compte_id + date de début)"
        tests: [unique, not_null]
      - name: compte_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_comptes')
                field: compte_id
      - name: date_debut_validite
        tests: [not_null]
      - name: date_fin_validite
        description: "Borne EXCLUE ; 9999-12-31 pour la version courante"
        tests: [not_null]
      - name: is_current
        tests: [not_null]
      - name: version_number
        description: "Rang de la version, 1 = version initiale"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: statut
        tests:
          - accepted_values:
              arguments:
                values: ['actif', 'inactif', 'cloture', 'suspendu']
      - name: kyc_level
        tests:
          - accepted_values:
              arguments:
                values: ['basic', 'intermediate', 'advanced', 'not_verified']
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['compte_id', 'date_debut_validite']

  - name: dim_categories
    description: |
      Dimension catégories avec hiérarchie résolue par CTE récursive.
      Grain : une ligne par catégorie active. Expose le chemin complet depuis
      la racine, la profondeur réelle et l'identifiant de l'ancêtre racine.
    config:
      access: public
      group: core
    columns:
      - name: categorie_id
        tests: [unique, not_null]
      - name: nom_categorie
        tests: [not_null]
      - name: chemin_complet
        description: "Chemin depuis la racine, séparé par ' > '"
        tests: [not_null]
      - name: niveau
        description: "Profondeur réelle calculée par la récursion (1 = racine)"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 10
      - name: id_racine
        description: "Identifiant de l'ancêtre de plus haut niveau"
        tests:
          - not_null
          # L'ancêtre doit lui-même exister dans la dimension
          - relationships:
              arguments:
                to: ref('dim_categories')
                field: categorie_id
      - name: is_orphelin
        description: >
          Catégorie active dont le parent déclaré est absent du périmètre actif.
          Signale une incohérence du référentiel amont, pas une erreur du modèle.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [false]
                quote: false
              config:
                severity: warn
      - name: is_racine
        tests: [not_null]
      - name: ecart_niveau_source
        description: "Écart entre la profondeur calculée et le niveau déclaré en source"
        tests:
          - accepted_values:
              arguments:
                values: [false]
                quote: false
              config:
                severity: warn

  - name: bridge_comptes_titulaires
    description: |
      Bridge many-to-many entre comptes et titulaires (US 2.2).
      Grain : une ligne = un rattachement (compte, titulaire, période).
      Porte l'allocation_factor permettant de ventiler les montants d'un compte
      joint entre ses détenteurs. Toute jointure sur cette table doit être
      bornée par date_debut / date_fin.
    config:
      # `protected` et non `private` : un modèle private n'est référençable que
      # depuis son propre groupe, ce qui exclut les tests singuliers (qui
      # n'appartiennent à aucun groupe) et interdirait à tout mart hors du
      # groupe core de ventiler des montants par titulaire.
      # `protected` = référençable dans tout le projet, mais pas exposé aux
      # consommateurs externes — ce qui correspond exactement à l'usage visé
      # pour une bridge contenant de la PII.
      access: protected
      group: core
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['compte_id', 'titulaire_id', 'date_debut']
    columns:
      - name: bridge_key
        tests: [unique, not_null]
      - name: compte_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_comptes')
                field: compte_id
      - name: titulaire_id
        tests: [not_null]
      - name: allocation_factor
        description: "Quote-part du titulaire ; somme = 1 par compte à une date donnée"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: role_titulaire
        tests:
          - accepted_values:
              arguments:
                values: ['titulaire_principal', 'co_titulaire']
      - name: nb_titulaires_compte
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: date_debut
        tests: [not_null]
      - name: is_rattachement_courant
        tests: [not_null]

  # ============================================
  # FAITS
  # ============================================
  - name: fct_transactions
    description: |
      Table de faits principale — 50-100M lignes.
      Grain : une ligne = une transaction validee ou en_attente, non-reversal.
      Enrichie avec FX a date, categorisation, compliance.

      MODELE PUBLIC SOUS CONTRAT. Toute modification de structure (suppression
      ou renommage de colonne, changement de type) fait echouer le build.
      Procedure de migration : voir docs/CONTRACTS.md.

      Limite connue : le filtre de statut combine au merge laisse des lignes
      fantomes lorsqu'une transaction est rejetee apres insertion.
      Voir fct_transactions.sql et docs/DESIGN.md § Limites connues.
    latest_version: 1
    config:
      access: public
      group: core
      contract:
        enforced: true
    columns:
      - name: transaction_id
        data_type: number(18,0)
        description: "Identifiant unique de la transaction"
        tests: [unique, not_null]
      - name: external_transaction_id
        data_type: varchar(50)
      - name: tenant_id
        data_type: number(38,0)
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tenants')
                field: tenant_id
      - name: compte_id
        data_type: number(38,0)
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_comptes')
                field: compte_id
      - name: categorie_id
        data_type: number(38,0)
      - name: date_transaction
        data_type: timestamp_ntz
        tests: [not_null]
      - name: jour_transaction
        data_type: date
      - name: semaine_transaction
        data_type: date
      - name: mois_transaction
        data_type: date
      - name: date_valeur
        data_type: timestamp_ntz
      - name: date_settlement
        data_type: timestamp_ntz
      - name: montant
        data_type: number(15,2)
      - name: devise
        data_type: varchar(9)
      - name: montant_eur
        data_type: number(30,2)
        description: "Montant converti au taux du jour — division, voir US 4.2"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100000000
              config:
                severity: warn
      - name: taux_change_retenu
        data_type: number(18,8)
        description: "Taux effectivement applique — permet de rejouer le calcul"
      - name: is_taux_referentiel
        data_type: boolean
      - name: montant_signe
        data_type: number(15,2)
      - name: montant_signe_eur
        data_type: number(30,2)
      - name: frais
        data_type: number(10,2)
      - name: montant_net
        data_type: number(15,2)
      - name: type_operation
        data_type: varchar(10)
      - name: sens
        data_type: varchar(10)
      - name: statut
        data_type: varchar(30)
        description: >
          Statut de la transaction. Le fait ne retient que 'validee' et
          'en_attente' : une transaction passee a 'rejetee' apres insertion
          conserve son ancien statut (lignes fantomes — limite documentee
          dans fct_transactions.sql et docs/DESIGN.md).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['validee', 'en_attente']
      - name: moyen_paiement
        data_type: varchar(20)
      - name: canal
        data_type: varchar(30)
      - name: type_compte
        data_type: varchar(20)
      - name: customer_segment
        data_type: varchar(20)
      - name: pays_compte
        data_type: varchar(6)
      - name: nom_categorie
        data_type: varchar(100)
      - name: type_categorie
        data_type: varchar(20)
      - name: groupe
        data_type: varchar(50)
      - name: marchand_nom
        data_type: varchar(200)
      - name: marchand_categorie
        data_type: varchar(50)
      - name: marchand_pays
        data_type: varchar(6)
      - name: marchand_mcc
        data_type: number(38,0)
      - name: aml_score
        data_type: number(6,2)
      - name: aml_flag
        data_type: varchar(30)
      - name: fraud_score
        data_type: number(6,2)
      - name: is_flagged_for_review
        data_type: boolean
      - name: is_reconciled
        data_type: boolean
      - name: reconciliation_batch_id
        data_type: varchar(50)
      - name: source_system
        data_type: varchar(50)
      - name: created_at
        data_type: timestamp_ntz
      - name: updated_at
        data_type: timestamp_ntz
      - name: _loaded_at
        data_type: timestamp_ntz

    versions:
      # v1 — version de reference. L'alias conserve l'emplacement physique
      # historique : sans lui, dbt materialiserait la table en
      # FCT_TRANSACTIONS_V1 et tous les outils pointant sur
      # MARTS_CORE.FCT_TRANSACTIONS cesseraient de la trouver.
      - v: 1
        config:
          alias: fct_transactions
        tests:
          # Detection d'anomalies de volumetrie (US 6.3).
          #
          # DEUX PIEGES, DECOUVERTS A L'EXECUTION.
          #
          # 1. Elementary calcule ses fenetres par rapport a la DATE DU JOUR.
          #    Nos donnees s'arretent au 31/12/2024, soit plus de 20 mois dans
          #    le passe : avec les valeurs par defaut (detection 2 jours,
          #    entrainement 14), le test ne verrait aucune ligne et passerait
          #    au vert sans rien analyser — un faux vert.
          #
          # 2. Avec `seasonality: day_of_week`, le compteur de la fenetre
          #    d'entrainement s'exprime en BUCKETS DU MEME JOUR DE SEMAINE, pas
          #    en jours. Un training_period de 1095 a donc produit 1095 mardis,
          #    soit 21 ans d'historique remontant a 2005. Les ~900 buckets
          #    anterieurs a nos donnees ont ete comptes a ZERO, ramenant la
          #    moyenne d'entrainement a 105 lignes/jour contre ~1300 reelles.
          #    Resultat : 79 journees parfaitement normales signalees a plus de
          #    5 ecarts-types. Le test mesurait l'absence d'historique, pas une
          #    anomalie de volume.
          #
          # D'ou 26 buckets d'entrainement (26 semaines, soit ~6 mois) et une
          # detection bornee a 100 jours, qui reste dans la plage des donnees.
          - elementary.volume_anomalies:
              arguments:
                timestamp_column: date_transaction
                time_bucket:
                  period: day
                  count: 1
                # 730 jours : il faut remonter jusqu'aux donnees. Avec 100
                # jours, la fenetre couvrait juillet-octobre 2026 — ou il n'y a
                # rien — et le test passait au vert sans analyser une seule
                # ligne. Les deux fenetres se reglent ENSEMBLE : la detection
                # doit atteindre les donnees, l'entrainement doit rester dedans.
                detection_period:
                  period: day
                  count: 730
                training_period:
                  period: day
                  count: 26
                anomaly_direction: both
                # Les volumes bancaires suivent un rythme hebdomadaire marque
                # (creux du week-end) : sans cette correction, chaque samedi
                # ressortirait comme une anomalie.
                seasonality: day_of_week
              config:
                severity: warn

      - v: 2
        config:
          materialized: view
        columns:
          - include: all
          - name: montant_hors_taxes
            data_type: number(30,2)
            description: >
              Montant hors taxes des achats marchands (TVA 20 % par convention).
              Null hors achat marchand : un virement ou un salaire n'ont pas de TVA.

  - name: fct_virements
    description: |
      Faits virements — double-écriture sortant/entrant.
      Grain : une ligne = une leg. Chaque virement exécuté produit exactement
      2 lignes, identifiées par la clé composite (virement_id, virement_leg).
    config:
      access: public
      group: core
    tests:
      # Une seule ligne par (virement, leg)
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['virement_id', 'virement_leg']
      # Les deux invariants de la double-écriture — exactement 2 legs par
      # virement, et somme des montants signés nulle — sont vérifiés par des
      # tests singuliers (tests/assert_virements_*.sql) : la version installée
      # de dbt_utils.expression_is_true ne supporte pas group_by_columns.
    columns:
      - name: virement_leg_key
        description: "Clé technique de la leg (hash de virement_id + virement_leg)"
        tests: [unique, not_null]
      - name: virement_id
        tests: [not_null]
      - name: virement_leg
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['sortant', 'entrant']
      - name: compte_id
        description: "Compte porteur de la leg (source si sortant, destinataire si entrant)"
        tests: [not_null]
      - name: contrepartie_compte_id
        description: "Compte de l'autre leg du même virement"
        tests: [not_null]
      - name: montant_signe
        description: "Montant négatif sur la leg sortante, positif sur la leg entrante"
        tests: [not_null]
      - name: statut
        tests:
          - accepted_values:
              arguments:
                values: ['execute']

groups:
  - name: core
    owner:
      name: Data Platform Team
      email: data-platform@fintrack.example
