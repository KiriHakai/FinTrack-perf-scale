version: 2

models:
  - name: stg_tenants
    description: "Tenants (banques partenaires) nettoyés"
    columns:
      - name: tenant_id
        tests: [unique, not_null]

  - name: stg_categories
    description: "Référentiel catégories — actives uniquement"
    columns:
      - name: categorie_id
        tests: [unique, not_null]

  - name: stg_fx_rates
    description: "Taux FX quotidiens"
    columns:
      - name: fx_id
        tests: [unique, not_null]

  - name: stg_comptes
    description: "Comptes clients avec typage et normalisation"
    columns:
      - name: compte_id
        tests: [unique, not_null]
      - name: tenant_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tenants')
                field: tenant_id

  - name: stg_transactions
    description: "Transactions typées, incremental merge"
    columns:
      - name: transaction_id
        tests: [unique, not_null]

  - name: stg_virements
    description: "Virements internes typés, incremental merge"
    columns:
      - name: virement_id
        tests: [unique, not_null]

  - name: stg_titulaires
    description: "Personnes physiques détentrices de comptes (US 2.2)"
    columns:
      - name: titulaire_id
        tests: [unique, not_null]
      - name: titulaire_hash
        description: "Empreinte des données nominatives, pour rapprochement sans exposer la PII"
        tests: [not_null]

  - name: stg_compte_titulaires
    description: "Rattachements compte <-> titulaire, avec clé de répartition et historisation"
    columns:
      - name: compte_titulaire_id
        tests: [unique, not_null]
      - name: compte_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_comptes')
                field: compte_id
      - name: titulaire_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_titulaires')
                field: titulaire_id
      - name: allocation_factor
        description: "Quote-part du titulaire sur le compte ; somme = 1 par compte à une date donnée"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: role_titulaire
        tests:
          - accepted_values:
              arguments:
                values: ['titulaire_principal', 'co_titulaire']
