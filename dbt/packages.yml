packages:
  - package: dbt-labs/dbt_utils
    version: [">=1.1.0", "<2.0.0"]

  # Repris par Metaplane — le préfixe calogica/ est déprécié pour ce package
  - package: metaplane/dbt_expectations
    version: [">=0.10.0", "<1.0.0"]

  # dbt_date n'est plus déclaré explicitement : il est tiré en dépendance
  # transitive par dbt_expectations. Le déclarer ici provoquait un conflit
  # "duplicate project dbt_date" (deux propriétaires différents pour le même
  # nom de projet). Aucun modèle n'utilise ses macros — seule la variable
  # dbt_date:time_zone est positionnée dans dbt_project.yml.

  - package: dbt-labs/codegen
    version: [">=0.12.0", "<1.0.0"]

  # Observabilité des donnees (US 6.3).
  # Version epinglee et non en plage : Elementary cree ses propres tables et
  # ses modeles evoluent entre versions mineures — une montee automatique
  # pourrait casser le schema de monitoring sans prevenir.
  - package: elementary-data/elementary
    version: 0.26.1
